<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>梦幻青蓝紫 · 手势花开</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030a; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #ffe9f4;
    background: radial-gradient(ellipse 90% 70% at 50% 34%, #130a2a 0%, #080414 42%, #05030a 100%);
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #cam { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .hud { position: fixed; top: 24px; left: 24px; padding: 16px 20px 14px; border-radius: 16px; background: rgba(20, 10, 35, 0.45); border: 1px solid rgba(160, 200, 255, 0.16); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); user-select: none; pointer-events: none; max-width: 300px; }
  .hud .title { font-size: 18px; font-weight: 600; letter-spacing: 3px; background: linear-gradient(92deg, #c084fc 0%, #a855f7 40%, #22d3ee 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hud .sub { margin-top: 6px; font-size: 11.5px; line-height: 1.7; color: rgba(200, 220, 255, 0.6); letter-spacing: 0.5px; }
  .hud .bar { margin-top: 12px; width: 100%; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
  .hud .bar .fill { height: 100%; width: 0%; border-radius: 4px; background: linear-gradient(90deg, #a855f7, #22d3ee); box-shadow: 0 0 12px rgba(34, 211, 238, 0.8); transition: width 0.08s linear; }
  .hud .status { margin-top: 9px; font-size: 12px; letter-spacing: 1px; color: rgba(200, 220, 255, 0.85); display: flex; justify-content: space-between; }
  .hud .status .num { color: #22d3ee; font-variant-numeric: tabular-nums; }
  .preview-wrap { position: fixed; right: 20px; bottom: 20px; width: 200px; height: 150px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(160, 200, 255, 0.22); box-shadow: 0 14px 44px rgba(0,0,0,0.6), 0 0 26px rgba(168, 85, 247, 0.12); background: #0b0614; transition: opacity 0.5s ease, transform 0.5s ease; transform: scaleX(-1); }
  .preview-wrap.hidden { opacity: 0; transform: scaleX(-1) translateY(16px); }
  #preview { display: block; width: 100%; height: 100%; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 45%, #130a2a 0%, #05030a 75%); z-index: 50; transition: opacity 0.8s ease; font-size: 13px; letter-spacing: 3px; color: rgba(200, 220, 255, 0.75); }
  #loading.done { opacity: 0; pointer-events: none; }
  .spinner { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(168, 85, 247, 0.15); border-top-color: #22d3ee; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 420px; padding: 20px 24px; border-radius: 14px; background: rgba(60, 10, 30, 0.85); border: 1px solid rgba(255, 90, 140, 0.35); font-size: 13px; line-height: 1.8; color: #ffc4d8; display: none; z-index: 60; text-align: center; }
  @media (max-width: 640px) {
    .hud { top: 14px; left: 14px; padding: 12px 15px 11px; max-width: 220px; }
    .hud .title { font-size: 15px; letter-spacing: 2px; }
    .hud .sub { font-size: 10px; }
    .preview-wrap { width: 140px; height: 105px; right: 12px; bottom: 12px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<video id="cam" playsinline muted autoplay></video>
<div class="hud">
  <div class="title">梦幻星云玫瑰</div>
  <div class="sub">张开手掌 · 花朵绽放　｜　握拳 · 收拢成苞</div>
  <div class="bar"><div class="fill" id="bar"></div></div>
  <div class="status"><span id="status">初始化中…</span><span class="num" id="num">0%</span></div>
</div>
<div class="preview-wrap hidden" id="previewWrap"><canvas id="preview" width="200" height="150"></canvas></div>
<div id="loading"><div class="spinner"></div><div>正在唤醒花朵…</div></div>
<div id="error"></div>

<script src="https://fastly.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://fastly.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const state = { bloom: 0, targetBloom: 0, rawBloom: 0, time: 0, autoRot: 0, hasHand: false, lastHandTime: 0 };
const pointer = new THREE.Vector2(0, 0);
const pointerTarget = new THREE.Vector2(0, 0);
let lastLandmarks = null;

const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 4.2, 8.6);
camera.lookAt(0, 0.7, 0);

// 背景星空
(function addStars() {
  const N = 1200;
  const pos = new Float32Array(N * 3);
  const colors = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 24 + Math.random() * 34;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi) * 0.8 + 4;
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    const c = new THREE.Color().setHSL(0.7 + Math.random()*0.2, 0.8, 0.6);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const m = new THREE.PointsMaterial({ vertexColors: true, size: 0.12, transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
  scene.add(new THREE.Points(g, m));
})();

function buildFlower() {
  const P = [], B = [], C = [], D = [], S = [], Q = [];
  const col = [0, 0, 0];
  function lerpColor(a, b, t) { col[0] = a[0] + (b[0] - a[0]) * t; col[1] = a[1] + (b[1] - a[1]) * t; col[2] = a[2] + (b[2] - a[2]) * t; return col; }
  
  function addParticle(px, py, pz, r, g, b, delay, size, seed) {
    P.push(px, py, pz); C.push(r, g, b); D.push(Math.min(1, delay)); S.push(size); Q.push(seed);
    const len = Math.hypot(px, py, pz) || 1;
    const nx = px / len, ny = py / len, nz = pz / len;
    // 花苞非常紧实
    const rad = 0.08 + Math.random() * 0.1;
    B.push(nx * rad * 0.8, ny * rad * 1.2 + 0.15, nz * rad * 0.8);
  }

  // 正常花瓣形态，从内到外，紫渐变到青蓝
  const layers = [
    // 最内层：紧包，紫色，微微向内卷
    { petals: 6, count: 600, len: 1.2, width: 0.7, tilt: 1.4, r0: 0.1, offset: 0.0, cA: [0.5, 0.1, 0.8], cB: [0.6, 0.2, 0.9], delayBase: 0.0, sizeBase: 1.6 },
    // 中层：舒展，紫偏粉
    { petals: 7, count: 900, len: 2.0, width: 1.0, tilt: 0.9, r0: 0.15, offset: 0.8, cA: [0.6, 0.2, 0.9], cB: [0.4, 0.5, 0.95], delayBase: 0.15, sizeBase: 1.8 },
    // 中外层：青蓝
    { petals: 8, count: 1200, len: 2.8, width: 1.3, tilt: 0.5, r0: 0.2, offset: 2.0, cA: [0.4, 0.5, 0.95], cB: [0.1, 0.8, 1.0], delayBase: 0.3, sizeBase: 2.0 },
    // 最外层：宽大，平展，青蓝泛白
    { petals: 8, count: 1400, len: 3.5, width: 1.6, tilt: 0.2, r0: 0.25, offset: 3.5, cA: [0.1, 0.8, 1.0], cB: [0.5, 0.9, 1.0], delayBase: 0.45, sizeBase: 2.2 }
  ];

  for (const L of layers) {
    for (let pi = 0; pi < L.petals; pi++) {
      const angle = (pi / L.petals) * Math.PI * 2 + L.offset;
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const ct = Math.cos(L.tilt), st = Math.sin(L.tilt);

      for (let i = 0; i < L.count; i++) {
        let u = Math.random(); 
        let s = (Math.random() * 2 - 1); 
        
        // 正常花瓣外轮廓：宽大水滴形
        const w = Math.pow(Math.sin(Math.PI * u), 0.6);
        const halfW = L.width * w;
        const lz = s * halfW;
        const lx = L.r0 + u * L.len;

        // 杯状形态：两边向上兜起
        let ly = 0.8 * s * s * halfW; 
        // 尖端微微下垂
        ly -= Math.pow(u, 2.5) * 0.4 * L.len;
        
        // 最内层向花心收拢
        if (L.tilt > 1.0) { ly += Math.pow(u, 2) * 0.4; }

        const rx = lx * ct - ly * st;
        const ry = lx * st + ly * ct;
        const px = rx * ca + lz * sa;
        const pz = -rx * sa + lz * ca;
        const py = ry;

        const tc = Math.pow(u, 0.6);
        const c = lerpColor(L.cA, L.cB, tc);
        const bright = 0.8 + Math.random() * 0.4;

        addParticle(px, py, pz, c[0] * bright, c[1] * bright, c[2] * bright, L.delayBase + Math.random() * 0.2, L.sizeBase * (0.8 + Math.random()*0.4), Math.random());
      }
    }
  }

  // 核心：银金色花蕊
  const CORE = 1800;
  const goldA = [1.0, 0.8, 0.4]; // 金
  const goldB = [1.0, 1.0, 1.0]; // 银白
  for (let i = 0; i < CORE; i++) {
    const r = Math.pow(Math.random(), 0.5) * 0.45;
    const cosPhi = Math.random();
    const sinPhi = Math.sqrt(1 - cosPhi * cosPhi);
    const theta = Math.random() * Math.PI * 2;
    const x = r * sinPhi * Math.cos(theta);
    const z = r * sinPhi * Math.sin(theta);
    const y = r * cosPhi * 0.9 + 0.15;
    const c = lerpColor(goldA, goldB, Math.pow(Math.random(), 0.8));
    const bright = 0.9 + Math.random() * 0.5;
    addParticle(x, y, z, c[0]*bright, c[1]*bright, c[2]*bright, 0.55 + Math.random() * 0.2, 1.2 + Math.random() * 1.5, Math.random());
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  geo.setAttribute('aBud', new THREE.Float32BufferAttribute(B, 3));
  geo.setAttribute('aColor', new THREE.Float32BufferAttribute(C, 3));
  geo.setAttribute('aDelay', new THREE.Float32BufferAttribute(D, 1));
  geo.setAttribute('aSize', new THREE.Float32BufferAttribute(S, 1));
  geo.setAttribute('aSeed', new THREE.Float32BufferAttribute(Q, 1));
  geo.computeBoundingSphere();
  return geo;
}

const vertexShader = `
  attribute vec3 aBud; attribute vec3 aColor; attribute float aDelay; attribute float aSize; attribute float aSeed;
  uniform float uBloom; uniform float uTime; uniform float uPixelRatio; uniform vec2 uPointer;
  varying vec3 vColor; varying float vAlpha;
  float easeOutCubic(float t) { float f = 1.0 - t; return 1.0 - f * f * f; }
  void main() {
    float raw = clamp((uBloom - aDelay * 0.45) / 0.55, 0.0, 1.0);
    float t = easeOutCubic(raw);
    vec3 pos = mix(aBud, position, t);
    
    float ph = aSeed * 6.2831853;
    pos.x += sin(uTime * 1.1 + ph) * 0.015; 
    pos.y += cos(uTime * 1.4 + ph * 1.2) * 0.015; 
    pos.z += sin(uTime * 0.9 + ph * 0.8) * 0.015;
    
    float amp = 0.3 * (0.1 + aSeed * 0.9) * smoothstep(0.0, 0.9, t);
    pos.x += uPointer.x * amp; 
    pos.y += uPointer.y * amp;
    
    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mv;
    
    float shrink = mix(0.5, 1.0, t);
    gl_PointSize = aSize * uPixelRatio * shrink * (8.0 / max(0.001, -mv.z));
    vColor = aColor; 
    vAlpha = mix(0.3, 1.0, t);
  }
`;

const fragmentShader = `
  varying vec3 vColor; varying float vAlpha;
  void main() {
    vec2 c = gl_PointCoord - 0.5; 
    float d = length(c);
    if (d > 0.5) discard;
    float glow = smoothstep(0.5, 0.1, d);
    float a = pow(glow, 1.5);
    gl_FragColor = vec4(vColor * a * 1.2, a * vAlpha);
  }
`;

const uniforms = { uBloom: { value: 0 }, uTime: { value: 0 }, uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }, uPointer: { value: new THREE.Vector2(0, 0) } };
const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader, transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending });
const flowerGeometry = buildFlower();
const flowerPoints = new THREE.Points(flowerGeometry, material);
const flowerGroup = new THREE.Group();
flowerGroup.add(flowerPoints);
flowerGroup.position.y = 0.35;
scene.add(flowerGroup);

const videoEl = document.getElementById('cam');
const previewWrap = document.getElementById('previewWrap');
const previewCv = document.getElementById('preview');
const pctx = previewCv.getContext('2d');
const CDN = 'https://fastly.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240';

function showError(msg) { const el = document.getElementById('error'); el.textContent = msg; el.style.display = 'block'; }

async function initHands() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false });
    videoEl.srcObject = stream; await videoEl.play();
  } catch (err) { showError('无法访问摄像头：' + (err.message || err.name) + '\n请检查浏览器权限，或改用 https / localhost 访问。'); return; }
  if (typeof window.Hands === 'undefined') { showError('MediaPipe Hands 加载失败，请检查网络后刷新页面。'); return; }
  const hands = new window.Hands({ locateFile: (file) => `${CDN}/${file}` });
  hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
  hands.onResults(onHandResults);
  previewWrap.classList.remove('hidden');
  (async function pump() {
    if (videoEl.readyState >= 2) { try { await hands.send({ image: videoEl }); } catch (e) {} }
    requestAnimationFrame(pump);
  })();
}

function onHandResults(results) {
  const list = results.multiHandLandmarks;
  if (list && list.length > 0) {
    const lm = list[0]; lastLandmarks = lm; state.lastHandTime = performance.now();
    const wrist = lm[0]; const mcpMid = lm[9];
    const palm = Math.hypot(mcpMid.x - wrist.x, mcpMid.y - wrist.y) + 1e-6;
    const tipIdx = [8, 12, 16, 20]; let distSum = 0;
    for (const i of tipIdx) { distSum += Math.hypot(lm[i].x - wrist.x, lm[i].y - wrist.y) / palm; }
    const ratio = distSum / tipIdx.length;
    const sigA = THREE.MathUtils.smoothstep(ratio, 1.08, 1.62);
    const chains = [[5, 6, 8], [9, 10, 12], [13, 14, 16], [17, 18, 20]]; let curlSum = 0;
    for (const [a, b, c] of chains) {
      const ax = lm[b].x - lm[a].x, ay = lm[b].y - lm[a].y;
      const bx = lm[c].x - lm[b].x, by = lm[c].y - lm[b].y;
      const la = Math.hypot(ax, ay) + 1e-6; const lb = Math.hypot(bx, by) + 1e-6;
      curlSum += (((ax * bx + ay * by) / (la * lb)) + 1) * 0.5;
    }
    const sigB = THREE.MathUtils.smoothstep(curlSum / chains.length, 0.30, 0.75);
    state.rawBloom = THREE.MathUtils.clamp(sigA * 0.55 + sigB * 0.45, 0, 1);
    state.hasHand = true;
    const tip = lm[8];
    pointerTarget.set(THREE.MathUtils.clamp(((1 - tip.x) * 2 - 1) * 0.9, -1, 1), THREE.MathUtils.clamp((1 - tip.y * 2) * 0.9, -1, 1));
  } else { lastLandmarks = null; state.hasHand = false; }
  drawPreview(lastLandmarks);
}

const HAND_CONNECTIONS = window.HAND_CONNECTIONS || [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function drawPreview(lm) {
  const W = previewCv.width, H = previewCv.height; pctx.clearRect(0, 0, W, H);
  if (videoEl.readyState >= 2) { pctx.drawImage(videoEl, 0, 0, W, H); pctx.fillStyle = 'rgba(5, 3, 10, 0.34)'; pctx.fillRect(0, 0, W, H); }
  if (!lm) return;
  pctx.lineWidth = 2; pctx.strokeStyle = 'rgba(120, 255, 235, 0.72)'; pctx.beginPath();
  for (const [a, b] of HAND_CONNECTIONS) { pctx.moveTo(lm[a].x * W, lm[a].y * H); pctx.lineTo(lm[b].x * W, lm[b].y * H); }
  pctx.stroke();
  for (let i = 0; i < lm.length; i++) {
    const isTip = (i === 4 || i === 8 || i === 12 || i === 16 || i === 20);
    pctx.beginPath(); pctx.arc(lm[i].x * W, lm[i].y * H, isTip ? 3.6 : 2.0, 0, Math.PI * 2);
    pctx.fillStyle = i === 8 ? '#a855f7' : 'rgba(255, 225, 245, 0.92)'; pctx.fill();
  }
}

const clock = new THREE.Clock();
const barEl = document.getElementById('bar'); const statusEl = document.getElementById('status'); const numEl = document.getElementById('num');
let hudAcc = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); state.time += dt; const now = performance.now();
  const handAlive = state.hasHand && (now - state.lastHandTime < 500);
  
  if (handAlive) { 
    state.targetBloom = state.rawBloom; 
  } else { 
    state.targetBloom = 0.12 + 0.05 * Math.sin(state.time * 1.2); 
    pointerTarget.multiplyScalar(0.94); 
  }
  
  const kB = 1 - Math.exp(-6.0 * dt); state.bloom += (state.targetBloom - state.bloom) * kB;
  const kP = 1 - Math.exp(-5.0 * dt); pointer.x += (pointerTarget.x - pointer.x) * kP; pointer.y += (pointerTarget.y - pointer.y) * kP;
  
  state.autoRot += dt * 0.15;
  flowerGroup.rotation.y = state.autoRot + pointer.x * 0.55; 
  flowerGroup.rotation.x = -pointer.y * 0.22;
  flowerGroup.position.y = 0.35 + Math.sin(state.time * 0.9) * 0.05;
  
  const kC = 1 - Math.exp(-2.5 * dt);
  camera.position.x += (pointer.x * 0.9 - camera.position.x) * kC; 
  camera.position.y += ((4.2 - pointer.y * 0.55) - camera.position.y) * kC; 
  camera.lookAt(0, 0.7, 0);
  
  uniforms.uBloom.value = state.bloom; 
  uniforms.uTime.value = state.time; 
  uniforms.uPointer.value.set(pointer.x * 0.6, pointer.y * 0.6);
  
  renderer.render(scene, camera);
  
  hudAcc += dt;
  if (hudAcc > 0.08) {
    hudAcc = 0; const p = Math.round(state.bloom * 100); barEl.style.width = p + '%'; numEl.textContent = p + '%';
    if (!handAlive) { statusEl.textContent = '未检测到手 · 待机'; } 
    else if (state.bloom > 0.62) { statusEl.textContent = '✋ 绽放'; } 
    else if (state.bloom < 0.28) { statusEl.textContent = '✊ 含苞'; } 
    else { statusEl.textContent = '🤚 半开'; }
  }
}

window.addEventListener('resize', () => {
  const w = window.innerWidth; const h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix(); 
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
  renderer.setSize(w, h); 
  uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
});

animate();

initHands().finally(() => { setTimeout(() => { document.getElementById('loading').classList.add('done'); }, 400); });
setTimeout(() => { document.getElementById('loading').classList.add('done'); }, 6000);
</script>
</body>
</html>
