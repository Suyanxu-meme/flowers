<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>指尖花开 · 梦幻星云</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020108; }
  body { font-family: -apple-system, sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; touch-action: none; }
  #cam { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .hud { position: fixed; top: 20px; left: 20px; padding: 14px 18px; border-radius: 16px; background: rgba(20, 10, 35, 0.4); border: 1px solid rgba(160, 200, 255, 0.2); backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: none; }
  .hud .title { font-size: 16px; font-weight: 600; letter-spacing: 2px; background: linear-gradient(90deg, #ff7eb3, #a855f7, #06b6d4); -webkit-background-clip: text; color: transparent; }
  .hud .sub { margin-top: 4px; font-size: 11px; color: rgba(200, 220, 255, 0.6); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020108; z-index: 50; transition: opacity 0.8s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  .spinner { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(168, 85, 247, 0.2); border-top-color: #06b6d4; animation: spin 1s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { font-size: 13px; letter-spacing: 2px; color: #a855f7; }
</style>
</head>
<body>
<div id="app"></div>
<video id="cam" playsinline muted autoplay></video>
<div class="hud">
  <div class="title">梦幻星云 · 玫瑰</div>
  <div class="sub">张手绽放 · 握拳收拢 · 触屏交互</div>
</div>
<div id="loading"><div class="spinner"></div><div class="text">正在唤醒星空…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ============ 核心状态 ============
let handBloom = 0, targetHandBloom = 0;
const clock = new THREE.Clock();
const container = document.getElementById('app');

// ============ 1. 场景与相机 ============
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020108, 0.02);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 4, 8.5);
camera.lookAt(0, 0.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// ============ 2. 后期处理 (发光效果) ============
const renderScene = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.5, 0.4, 0.85);
bloomPass.threshold = 0.1;
bloomPass.strength = 1.2;
bloomPass.radius = 0.5;
const composer = new EffectComposer(renderer);
composer.addPass(renderScene);
composer.addPass(bloomPass);

// ============ 3. 梦幻星空与星云背景 ============
const bgGeo = new THREE.BufferGeometry();
const bgCount = 3000;
const bgPos = new Float32Array(bgCount * 3);
const bgCol = new Float32Array(bgCount * 3);
for (let i = 0; i < bgCount; i++) {
  const r = 20 + Math.random() * 40;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  bgPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
  bgPos[i*3+1] = r * Math.cos(phi) * 0.8 + 5;
  bgPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
  const c = new THREE.Color().setHSL(0.65 + Math.random()*0.2, 0.8, 0.6 + Math.random()*0.4);
  bgCol[i*3] = c.r; bgCol[i*3+1] = c.g; bgCol[i*3+2] = c.b;
}
bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
bgGeo.setAttribute('color', new THREE.BufferAttribute(bgCol, 3));
const bgMat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.Points(bgGeo, bgMat));

// ============ 4. 主花朵生成 ============
function buildFlower() {
  const P = [], B = [], C = [], D = [], S = [], Q = [];
  const layers = [
    { p: 8, n: 1200, l: 3.2, w: 1.4, t: 0.3, r: 0.2, o: 0, d: 0, s: 1.8 },
    { p: 7, n: 1000, l: 2.6, w: 1.1, t: 0.6, r: 0.18, o: 1.2, d: 0.15, s: 1.9 },
    { p: 7, n: 800,  l: 2.0, w: 0.9, t: 0.9, r: 0.15, o: 2.4, d: 0.25, s: 2.0 },
    { p: 6, n: 600,  l: 1.4, w: 0.7, t: 1.2, r: 0.1,  o: 0.6, d: 0.35, s: 2.1 },
    { p: 5, n: 400,  l: 0.8, w: 0.5, t: 1.4, r: 0.05, o: 1.8, d: 0.45, s: 2.2 },
  ];
  const c1 = [1.0, 0.4, 0.8], c2 = [0.65, 0.3, 0.9], c3 = [0.1, 0.8, 1.0]; // 粉 -> 紫 -> 青蓝

  for (const L of layers) {
    for (let pi = 0; pi < L.p; pi++) {
      const a = (pi / L.p) * Math.PI * 2 + L.o;
      const ca = Math.cos(a), sa = Math.sin(a), ct = Math.cos(L.t), st = Math.sin(L.t);
      for (let i = 0; i < L.n; i++) {
        let u = Math.random(), s = Math.random() * 2 - 1;
        const w = Math.pow(Math.sin(Math.PI * u), 0.5);
        const lz = s * L.w * w, lx = L.r + u * L.l;
        let ly = 0.8 * s * s * L.w * w - Math.pow(u, 3) * 0.5 * L.l;
        if (L.t > 1.0) ly += Math.pow(u, 2) * 0.4; // 内层向内包
        
        const rx = lx * ct - ly * st, ry = lx * st + ly * ct;
        P.push(rx * ca + lz * sa, ry, -rx * sa + lz * ca);
        
        // 花苞状态位置
        const len = Math.hypot(rx, ry, lz) || 1;
        const br = 0.1 + Math.random() * 0.15;
        B.push((rx/len)*br, (ry/len)*br*1.2 + 0.1, (lz/len)*br);
        
        // 渐变颜色计算
        const mixT = u * 0.8 + Math.random() * 0.2;
        let col = [0,0,0];
        if (mixT < 0.5) { const t = mixT * 2; col = [c1[0]+(c2[0]-c1[0])*t, c1[1]+(c2[1]-c1[1])*t, c1[2]+(c2[2]-c1[2])*t]; }
        else { const t = (mixT - 0.5) * 2; col = [c2[0]+(c3[0]-c2[0])*t, c2[1]+(c3[1]-c2[1])*t, c2[2]+(c3[2]-c2[2])*t]; }
        const brg = 0.8 + Math.random() * 0.4;
        C.push(col[0]*brg, col[1]*brg, col[2]*brg);
        
        D.push(L.d + Math.random() * 0.2);
        S.push(L.s * (0.8 + Math.random() * 0.4));
        Q.push(Math.random());
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  geo.setAttribute('aBud', new THREE.Float32BufferAttribute(B, 3));
  geo.setAttribute('aColor', new THREE.Float32BufferAttribute(C, 3));
  geo.setAttribute('aDelay', new THREE.Float32BufferAttribute(D, 1));
  geo.setAttribute('aSize', new THREE.Float32BufferAttribute(S, 1));
  geo.setAttribute('aSeed', new THREE.Float32BufferAttribute(Q, 1));
  return geo;
}

// ============ 5. 花朵着色器 ============
const flowerMat = new THREE.ShaderMaterial({
  uniforms: {
    uBloom: { value: 0 },
    uTime: { value: 0 },
    uPR: { value: Math.min(devicePixelRatio, 2) },
    uMouse: { value: new THREE.Vector2(0, 0) }
  },
  vertexShader: `
    attribute vec3 aBud; attribute vec3 aColor; attribute float aDelay; attribute float aSize; attribute float aSeed;
    uniform float uBloom; uniform float uTime; uniform float uPR; uniform vec2 uMouse;
    varying vec3 vColor; varying float vAlpha;
    float elastic(float t) { return t == 0.0 ? 0.0 : t == 1.0 ? 1.0 : pow(2.0, -10.0 * t) * sin((t * 10.0 - 0.75) * (2.0 * 3.14159) / 3.0) + 1.0; }
    void main() {
      float raw = clamp((uBloom - aDelay * 0.4) / 0.6, 0.0, 1.0);
      float t = elastic(raw);
      vec3 pos = mix(aBud, position, t);
      float ph = aSeed * 6.2831853;
      pos.x += sin(uTime * 1.5 + ph) * 0.02;
      pos.y += cos(uTime * 1.8 + ph) * 0.02;
      pos.x += uMouse.x * 0.5 * (0.1 + aSeed);
      pos.y += uMouse.y * 0.5 * (0.1 + aSeed);
      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uPR * mix(0.5, 1.0, t) * (0.8 + 0.4 * sin(uTime * 4.0 + ph)) * (8.5 / -mv.z);
      vColor = aColor;
      vAlpha = mix(0.2, 1.0, t);
    }
  `,
  fragmentShader: `
    varying vec3 vColor; varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float core = smoothstep(0.2, 0.0, d);
      float a = pow(smoothstep(0.5, 0.1, d), 1.2);
      gl_FragColor = vec4(vColor + vec3(core * 0.4), a * vAlpha);
    }
  `,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});

const flower = new THREE.Points(buildFlower(), flowerMat);
const flowerGroup = new THREE.Group();
flowerGroup.add(flower);
flowerGroup.position.y = 0.35;
scene.add(flowerGroup);

// ============ 6. 交互特效系统 (光晕 & 拖尾) ============
// 拖尾粒子池
const trailCount = 5000;
const trailGeo = new THREE.BufferGeometry();
const trailPos = new Float32Array(trailCount * 3);
const trailCol = new Float32Array(trailCount * 3);
const trailLife = new Float32Array(trailCount);
const trailVel = [];
for(let i=0; i<trailCount; i++) { trailPos[i*3+1] = -999; trailVel.push({x:0,y:0,z:0}); }
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3));
const trailMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
const trailMesh = new THREE.Points(trailGeo, trailMat);
scene.add(trailMesh);

// 点击光晕池
const ripples = [];
for(let i=0; i<10; i++) {
  const rippleGeo = new THREE.RingGeometry(0.1, 0.15, 32);
  const rippleMat =new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
  const mesh = new THREE.Mesh(rippleGeo, rippleMat);
  mesh.visible = false;
  scene.add(mesh);
  ripples.push({ mesh, life: 0 });
}

// 3D 交互射线
const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const mouse3D = new THREE.Vector3();
let trailIndex = 0;

// 指针事件 (统一处理鼠标和多点触控)
const activePointers = new Map();
container.addEventListener('pointerdown', (e) => {
  const rect = container.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  
  activePointers.set(e.pointerId, { x, y });
  
  // 触发光晕扩散
  raycaster.setFromCamera(new THREE.Vector2(x, y), camera);
  if (raycaster.ray.intersectPlane(plane, mouse3D)) {
    const r = ripples.find(r => r.life <= 0);
    if (r) {
      r.mesh.position.copy(mouse3D);
      r.mesh.scale.set(1,1,1);
      r.mesh.material.opacity = 1;
      r.mesh.visible = true;
      r.life = 1.0;
    }
  }
});

container.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  const rect = container.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  activePointers.set(e.pointerId, { x, y });

  // 发射拖尾粒子
  raycaster.setFromCamera(new THREE.Vector2(x, y), camera);
  if (raycaster.ray.intersectPlane(plane, mouse3D)) {
    for(let i=0; i<4; i++) {
      const idx = trailIndex % trailCount;
      trailPos[idx*3] = mouse3D.x + (Math.random()-0.5)*0.2;
      trailPos[idx*3+1] = mouse3D.y + (Math.random()-0.5)*0.2;
      trailPos[idx*3+2] = mouse3D.z + (Math.random()-0.5)*0.2;
      const c = new THREE.Color().setHSL(0.6 + Math.random()*0.3, 0.8, 0.7);
      trailCol[idx*3] = c.r; trailCol[idx*3+1] = c.g; trailCol[idx*3+2] = c.b;
      trailLife[idx] = 1.0;
      trailVel[idx] = { x: (Math.random()-0.5)*0.05, y: (Math.random()-0.5)*0.05, z: (Math.random()-0.5)*0.05 };
      trailIndex++;
    }
  }
});

container.addEventListener('pointerup', (e) => { activePointers.delete(e.pointerId); });
container.addEventListener('pointercancel', (e) => { activePointers.delete(e.pointerId); });


// ============ 7. MediaPipe 手势识别 ============
const video = document.getElementById('cam');
async function initHands() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream; await video.play();
  } catch (e) { console.warn("摄像头未授权"); return; }

  if (typeof window.Hands === 'undefined') return;
  const hands = new window.Hands({ locateFile: (f) => `https://unpkg.com/@mediapipe/hands@0.4.1675469240/${f}` });
  hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6 });
  
  hands.onResults((res) => {
    if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
      const lm = res.multiHandLandmarks[0];
      const wrist = lm[0], palm = Math.hypot(lm[9].x - wrist.x, lm[9].y - wrist.y) + 1e-6;
      let dSum = 0;
      [8,12,16,20].forEach(i => dSum += Math.hypot(lm[i].x - wrist.x, lm[i].y - wrist.y) / palm);
      targetHandBloom = THREE.MathUtils.smoothstep(dSum/4, 1.1, 1.7);
      
      const tip = lm[8];
      flowerMat.uniforms.uMouse.value.set(((1-tip.x)*2-1)*0.5, (1-tip.y*2)*0.5);
    }
  });

  (async function pump() {
    if (video.readyState >= 2) { try { await hands.send({ image: video }); } catch(e){} }
    requestAnimationFrame(pump);
  })();
}

// ============ 8. 主循环 ============
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.getElapsedTime();

  handBloom += (targetHandBloom - handBloom) * (1 - Math.exp(-5 * dt));
  const finalBloom = handBloom > 0.05 ? handBloom : 0.1 + 0.05 * Math.sin(time * 1.5);
  
  flowerMat.uniforms.uBloom.value = finalBloom;
  flowerMat.uniforms.uTime.value = time;

  flowerGroup.rotation.y = time * 0.1;
  flowerGroup.position.y = 0.35 + Math.sin(time * 0.8) * 0.05;

  for (let i = 0; i < trailCount; i++) {
    if (trailLife[i] > 0) {
      trailLife[i] -= dt * 1.5;
      trailPos[i*3] += trailVel[i].x;
      trailPos[i*3+1] += trailVel[i].y;
      trailPos[i*3+2] += trailVel[i].z;
    } else {
      trailPos[i*3+1] = -999;
    }
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;

  ripples.forEach(r => {
    if (r.life > 0) {
      r.life -= dt * 1.2;
      const scale = 1 + (1 - r.life) * 20;
      r.mesh.scale.set(scale, scale, 1);
      r.mesh.material.opacity = r.life * 0.8;
      if (r.life <= 0) r.mesh.visible = false;
    }
  });

  composer.render();
}

// 启动
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  flowerMat.uniforms.uPR.value = Math.min(devicePixelRatio, 2);
});

initHands().finally(() => {
  setTimeout(() => { document.getElementById('loading').classList.add('done'); }, 400);
});
setTimeout(() => { document.getElementById('loading').classList.add('done'); }, 3000);
animate();
</script>
</body>
</html>
